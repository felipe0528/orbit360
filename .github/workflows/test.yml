name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install and verify the portable multimedia runtime
        run: node scripts/bootstrap.mjs --install --json
      - name: Use the repository's runtime in tests
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {runtimeEnvironment} from './scripts/doctor.mjs';
          const env = runtimeEnvironment();
          fs.appendFileSync(process.env.GITHUB_ENV, `ORBIT_FFMPEG=${env.ORBIT_FFMPEG}\nORBIT_FFPROBE=${env.ORBIT_FFPROBE}\n`);
          NODE
      - run: npm run check
      - run: npm test
